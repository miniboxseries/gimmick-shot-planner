# สร้างหน้าเดโมอ่านอย่างเดียวจากโปรเจกต์เดโมในรีโป / publish the read-only demo to GitHub Pages
name: demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake the demo data
        run: python3 shot_planner.py scan
      - name: Assemble site
        run: |
          mkdir -p _site
          cp planner.html _site/index.html
          cp planner_data.js _site/
          cp -r shots sheets docs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
